# GAM Seller MCP Node — local dev/demo deployment.
# Published on host loopback only. For public hosting (TLS), use deploy/docker-compose.prod.yml.
#
#   docker compose up -d --build
services:
  seller-mcp-node:
    build: .
    ports:
      - "127.0.0.1:3900:3900"
    # environment:
    #   MCP_INTENT_HANDOFF: "file"                          # JSONL drop of committed intents on the data volume
    #   MCP_INTENT_HANDOFF_FILE: "/app/data/intent-handoff.jsonl"
    #   GAM_SA_KEY_PATH: "/run/secrets/gam-sa.json"         # live GAM forecast (needs config/gam.json)
    volumes:
      # Persistent state in named volumes (RS256 keys, ledger, denylist, anchors)
      - mcp-keys:/app/keys
      - mcp-data:/app/data
      # Per-deployment config — editable on the host without a rebuild
      - ./config:/app/config:ro
      # Live GAM forecast (opt-in): mount the service-account key read-only, outside the repo
      # - /secure/gam-sa.json:/run/secrets/gam-sa.json:ro
    restart: unless-stopped

volumes:
  mcp-keys:
  mcp-data:
